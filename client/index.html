<!doctype html>
<html lang="sr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="author" content="mera-system – https://mera-system.com" />
    <title>Component Tracker</title>
    <script>
        // tema pre učitavanja aplikacije (bez "treptanja")
        try {
            var t = localStorage.getItem('theme') || 'system';
            var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
            if (dark) document.documentElement.classList.add('app-dark');
            var sz = { small: 14, normal: 16, large: 18 }[localStorage.getItem('textSize')];
            if (sz) document.documentElement.style.fontSize = sz + 'px';
        } catch (e) {}
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
